- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceDemon
  categories: [ HideSpawnMenu ]
  name: demon appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: ADT/Mobs/Species/Demon/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganDemonTorso
      Head: OrganDemonHead
      ArmLeft: OrganDemonArmLeft
      ArmRight: OrganDemonArmRight
      HandRight: OrganDemonHandRight
      HandLeft: OrganDemonHandLeft
      LegLeft: OrganDemonLegLeft
      LegRight: OrganDemonLegRight
      FootLeft: OrganDemonFootLeft
      FootRight: OrganDemonFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganDemonHeart
      Stomach: OrganAnimalStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Demon

- type: entity
  save: false
  name: Urisst' Mzhand Demon
  parent:
  - AppearanceDemon
  - BaseSpeciesMobOrganic
  id: MobDemon
  components:
  - type: Wagging
  - type: Speech
    speechSounds: Lizard
  - type: Vocal
    emoteSounds: MaleHuman
  - type: Damageable
    damageModifierSet: Demon
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Slash: 2
        Piercing: 3
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 46
  - type: TemperatureDamage
    heatDamageThreshold: 363
    coldDamageThreshold: 250
    coldDamage:
      types:
        Cold: 0.2
    heatDamage:
      types:
        Heat: 0.1
  - type: TemperatureSpeed
    thresholds:
      285: 0.8
      248: 0.6
      220: 0.4

- type: entity
  parent: OrganBase
  id: OrganDemon
  abstract: true
  suffix: demon

- type: entity
  id: OrganDemonMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Demon ]

- type: entity
  parent: OrganDemon
  id: OrganDemonInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  id: OrganDemonVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: ADT/Mobs/Species/Demon/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Demon

- type: entity
  parent: [ OrganDemon, OrganDemonVisual ]
  id: OrganDemonExternal
  abstract: true
  components:
  - type: Sprite
    sprite: ADT/Mobs/Species/Demon/parts.rsi

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganDemonExternal ]
  id: OrganDemonTorso
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Tail

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganDemonExternal ]
  id: OrganDemonHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.HeadSide

- type: entity
  parent: [ OrganBaseArmLeft, OrganDemonExternal ]
  id: OrganDemonArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganDemonExternal ]
  id: OrganDemonArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganDemonExternal ]
  id: OrganDemonHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganDemonExternal ]
  id: OrganDemonHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganDemonExternal ]
  id: OrganDemonLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganDemonExternal ]
  id: OrganDemonLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganDemonExternal ]
  id: OrganDemonFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganDemonExternal ]
  id: OrganDemonFootRight

- type: entity
  parent: [ OrganBaseHeart, OrganDemonInternal, OrganDemonMetabolizer ]
  id: OrganDemonHeart
