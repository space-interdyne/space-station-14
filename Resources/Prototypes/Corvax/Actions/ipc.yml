- type: entity
  id: ActionDrainBattery
  name: Drain battery
  description: Drain battery
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: Corvax/Interface/ipcactions.rsi
      state: off
      map: ["enum.ActionVisuals.Icon"]
    - sprite: Corvax/Interface/ipcactions.rsi
      state: on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:ToggleDrainActionEvent

- type: entity
  id: ActionIpcChangeFace
  name: Change face
  description: Change the IPC monitor face
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: Interface/Actions/actions_ai.rsi
      state: crew_monitor
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:OpenIpcFaceActionEvent
