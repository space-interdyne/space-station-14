- type: entity
  save: false
  name: Urist McRaptor
  parent:
  - AppearanceResomi
  - BaseSpeciesMobOrganic
  id: MobResomi
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.32
        density: 160
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Speech
    speechVerb: Parrot
    speechSounds: MaleAvali
    allowedEmotes: ['Chirp', 'Trill', 'Warble', 'Wurble']
  - type: Vocal
    emoteSounds: MaleAvaliEmote
  - type: Damageable
    damageModifierSet: Resomi
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: AmmoniaBlood
        Quantity: 600
  - type: TemperatureDamage
    coldDamageThreshold: 0
    heatDamageThreshold: 320.15
    coldDamage:
      types:
        Cold: 0
    heatDamage:
      types:
        Heat: 3
  - type: TemperatureSpeed
    thresholds:
      272: 1
      242: 1
      196: 1
  - type: PseudoItem
    storedOffset: 20,0
    shape:
    - 0,2,0,3
    - 1,3,2,3
    - 3,2,3,3
    - 4,0,5,4
    - 6,0,6,3
    - 7,0,7,1
  - type: FireVisuals
    sprite: _Floofstation/Mobs/Effects/onfire.rsi
    normalState: Resomi_minor_burning
    alternateState: Resomi_burning

