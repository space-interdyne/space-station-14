- type: entity
  parent: BaseAction
  id: ActionEatMouse
  name: Eat Mouse
  description: Eat the mouse in your hand, gaining nutriment and a hairball charge.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
  - type: Sprite
    layers:
    - texture: Nyanotrasen/Icons/verbiconfangs.png
  - type: InstantAction
    event: !type:EatMouseActionEvent

- type: entity
  parent: BaseAction
  id: ActionHairball
  name: Cough Up Hairball
  description: Purge some of your chemstream, and gain a cool hairball to throw at people.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
  - type: Sprite
    sprite: Nyanotrasen/Objects/Specific/Species/felinid.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:HairballActionEvent
  - type: LimitedCharges
    maxCharges: 1
