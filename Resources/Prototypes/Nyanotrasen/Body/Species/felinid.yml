- type: markingsGroup
  parent: Undergarments
  id: Felinid
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ FelinidTailBasic ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ FelinidEarsBasic ]
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceFelinid
  categories: [ HideSpawnMenu ]
  name: Felinid appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganFelinidTorso
      Head: OrganFelinidHead
      ArmLeft: OrganFelinidArmLeft
      ArmRight: OrganFelinidArmRight
      HandRight: OrganFelinidHandRight
      HandLeft: OrganFelinidHandLeft
      LegLeft: OrganFelinidLegLeft
      LegRight: OrganFelinidLegRight
      FootLeft: OrganFelinidFootLeft
      FootRight: OrganFelinidFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganFelinidHeart
      Stomach: OrganFelinidStomach
      Liver: OrganFelinidLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Felinid

- type: entity
  save: false
  name: Urist McFelinid
  parent:
  - AppearanceFelinid
  - BaseSpeciesMobOrganic
  id: MobFelinid
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 140
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageModifierSet: Felinid
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 4
        Piercing: 1
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 1
  - type: Stamina
    baseCritThreshold: 75
  - type: Speech
    allowedEmotes: ['Meow', 'Mew', 'Growl', 'Purr', 'Hiss']
  - type: Vocal
    emoteSounds: MaleFelinid
  - type: PseudoItem
    storedOffset: 0,17
    shape:
    - 0,0,1,4
    - 0,2,3,4
    - 4,0,5,4
  - type: Felinid
  - type: NoShoesSilentFootsteps

- type: entity
  parent: OrganBase
  id: OrganFelinid
  abstract: true
  suffix: felinid

- type: entity
  id: OrganFelinidMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Animal ]

- type: entity
  parent: OrganFelinid
  id: OrganFelinidInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  id: OrganFelinidVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Felinid

- type: entity
  parent: [ OrganFelinid, OrganFelinidVisual ]
  id: OrganFelinidExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganFelinidExternal ]
  id: OrganFelinidTorso
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Tail

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganFelinidExternal ]
  id: OrganFelinidHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.Snout

- type: entity
  parent: [ OrganBaseArmLeft, OrganFelinidExternal ]
  id: OrganFelinidArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganFelinidExternal ]
  id: OrganFelinidArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganFelinidExternal ]
  id: OrganFelinidHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganFelinidExternal ]
  id: OrganFelinidHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganFelinidExternal ]
  id: OrganFelinidLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganFelinidExternal ]
  id: OrganFelinidLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganFelinidExternal ]
  id: OrganFelinidFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganFelinidExternal ]
  id: OrganFelinidFootRight

- type: entity
  parent: [ OrganBaseHeart, OrganFelinidInternal, OrganFelinidMetabolizer ]
  id: OrganFelinidHeart

- type: entity
  parent: [ OrganBaseStomach, OrganFelinidInternal, OrganFelinidMetabolizer ]
  id: OrganFelinidStomach
  components:
  - type: SolutionManager
    solutions:
    - SolutionStomach
    - SolutionFelinidFood

- type: entity
  parent: SolutionFood
  id: SolutionFelinidFood
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      maxVol: 5
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 5

- type: entity
  parent: [ OrganBaseLiver, OrganFelinidInternal, OrganFelinidMetabolizer ]
  id: OrganFelinidLiver
