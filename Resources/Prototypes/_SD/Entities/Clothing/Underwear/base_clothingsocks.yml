- type: entity
  abstract: true
  parent: [SolutionFood, Clothing, BaseSlicingRefinable]
  id: ClothingSocksBase
  name: socks
  description: Socks.
  components:
  - type: Sprite
    state: icon
  - type: Clothing
    quickEquip: true
    slots:
    - socks
    equipSound:
      path: /Audio/Items/jumpsuit_equip.ogg
      params:
        volume: -5
  - type: Item
    size: Small
  - type: ToolRefinable
    refineResult:
    - id: MaterialCloth1
      amount: 2
  - type: PhysicalComposition
    materialComposition:
      Cloth: 100
  - type: Edible
    requiresSpecialDigestion: true
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 10
  - type: TemperatureProtection
    coefficient: 0.90
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
