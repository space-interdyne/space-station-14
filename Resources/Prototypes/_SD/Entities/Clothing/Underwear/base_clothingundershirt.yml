- type: entity
  abstract: true
  parent: [SolutionFood, Clothing, BaseSlicingRefinable]
  id: ClothingUndershirtBase
  name: undershirt
  description: Huh.
  components:
  - type: Sprite
    state: icon
  - type: Clothing
    quickEquip: true
    slots:
    - undershirt
    equipSound:
      path: /Audio/Items/jumpsuit_equip.ogg
      params:
        volume: -5
  - type: Item
    size: Small
  - type: ToolRefinable
    refineResult:
    - id: MaterialCloth1
      amount: 2
  - type: PhysicalComposition
    materialComposition:
      Cloth: 100
  - type: Edible
    requiresSpecialDigestion: true
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 10
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon

- type: entity
  abstract: true
  parent: ClothingUndershirtBase
  id: ClothingShirtBase
  name: shirt
  description: Classic shirt.
  components:
  - type: TemperatureProtection
    heatingCoefficient: 0.90

- type: entity
  abstract: true
  parent: ClothingUndershirtBase
  id: ClothingBraBase
  name: bra
  description: Bra.
  components:
  - type: TemperatureProtection
    heatingCoefficient: 0.95
