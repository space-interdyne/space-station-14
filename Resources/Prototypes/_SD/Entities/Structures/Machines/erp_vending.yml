- type: entity
  parent: VendingMachine
  id: VendingMachineErp
  name: ERP machine
  description: A vending machine stocked with intimate accessories.
  suffix: Unlocked
  components:
  - type: VendingMachine
    pack: SDErpVendingMachineInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    denyState: deny-unshaded
  - type: SpeakOnUIClosed
    pack: GenericVendGoodbyes
  - type: Sprite
    sprite: _SD/Structures/Machines/VendingMachines/erp-machine.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#9966cc"
