- type: entity
  parent: [ ClothingBeltBase, ClothingSlotBase, BaseSyndicateContraband ]
  id: ClothingBeltSheathSyndicate
  name: rapier sheath
  description: A sinister, thin sheath suitable for a syndicate rapier.
  components:
  - type: Sprite
    sprite: _Wega/Clothing/Belt/syndie_sheath.rsi
    state: sheath
  - type: Clothing
    sprite: _Wega/Clothing/Belt/syndie_sheath.rsi
  - type: Item
    size: Ginormous
    shape:
    - 0,0,1,2
    storedOffset: 0,-2
    storedRotation: 45
  - type: ItemSlots
    slots:
      item:
        name: Rapier
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        ejectOnBreak: true
        whitelist:
          tags:
          - SyndicateRapier
  - type: ItemMapper
    mapLayers:
      sheath-rapier:
        whitelist:
          tags:
          - SyndicateRapier
  - type: Appearance
