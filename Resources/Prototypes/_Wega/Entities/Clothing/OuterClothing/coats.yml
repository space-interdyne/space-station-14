- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterCultRobesAlt
  name: cult robe
  description: "A set of robes worn by followers of the blood cult. Put on your hood and remove your ID card to hide your identity."
  components:
  - type: AllowSuitStorage
  - type: Sprite
    sprite: _Wega/Clothing/OuterClothing/Coats/cultrobesalt.rsi
  - type: Clothing
    sprite: _Wega/Clothing/OuterClothing/Coats/cultrobesalt.rsi
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
      storagebase: !type:Container {}
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodCultrobesAlt
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.8
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: CultEquipment
    cult: Blood

- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterFlagellantRobe
  name: flagellant robe
  description: Light clothes accelerate your movement, but bring you more damage.
  components:
  - type: Sprite
    sprite: _Wega/Clothing/OuterClothing/Coats/flagellantrobe.rsi
  - type: Clothing
    sprite: _Wega/Clothing/OuterClothing/Coats/flagellantrobe.rsi
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
      storagebase: !type:Container {}
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodFlagellantHood
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 1.5
        Slash: 1.5
        Piercing: 1.5
        Heat: 1.5
  - type: ExplosionResistance
    damageCoefficient: 1.5
  - type: ClothingSpeedModifier
    walkModifier: 1.6
    sprintModifier: 1.6
  - type: CultEquipment
    cult: Blood
